services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payoutops
      POSTGRES_USER: payoutops
      POSTGRES_PASSWORD: payoutops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payoutops -d payoutops"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM for the "ollama" Spring profile. Only started with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # Trace backend for the "tracing" Spring profile (UI on http://localhost:16686).
  # Only started with: docker compose --profile observability up -d
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP (used by the app)

  # Scrapes /actuator/prometheus from the app running on the host (UI on http://localhost:9090).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards over Prometheus (metrics) and Jaeger (traces) on http://localhost:3000, no login.
  # Anonymous admin is only acceptable because the port is bound to 127.0.0.1 (like Prometheus and
  # Jaeger above, which have no authentication either): never publish it on all interfaces or copy
  # this setup to a shared environment.
  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  ollama-models:
