services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payoutops
      POSTGRES_USER: payoutops
      POSTGRES_PASSWORD: payoutops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payoutops -d payoutops"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM for the "ollama" Spring profile. Only started with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
