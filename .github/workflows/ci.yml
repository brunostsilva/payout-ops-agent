name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Build and test (unit + Testcontainers integration tests)
        run: ./mvnw -B -ntp verify
