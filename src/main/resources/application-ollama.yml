spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Downloads the model on first start if the Ollama server doesn't have it yet.
        pull-model-strategy: when_missing
        timeout: 15m
      chat:
        # Needs a model with tool-calling support.
        model: "${OLLAMA_CHAT_MODEL:qwen2.5:7b}"
        temperature: 0
