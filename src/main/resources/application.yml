spring:
  application:
    name: payout-ops-agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payoutops}
    username: ${DATABASE_USERNAME:payoutops}
    password: ${DATABASE_PASSWORD:payoutops}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      # No real LLM by default: the deterministic ScriptedChatModel answers instead, so the app
      # and the tests run without API keys. Enable the "openai" or "ollama" profile for a real model.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
