spring:
  application:
    name: payout-ops-agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payoutops}
    username: ${DATABASE_USERNAME:payoutops}
    password: ${DATABASE_PASSWORD:payoutops}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      # No real LLM by default: the deterministic ScriptedChatModel answers instead, so the app
      # and the tests run without API keys. Enable the "openai" or "ollama" profile for a real model.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      server:
        # Streamable HTTP endpoint at /mcp, serving the same tools as the agent (see McpToolsConfiguration).
        name: payout-ops
        version: 0.1.0
        protocol: STREAMABLE
        instructions: >-
          Payout operations tools for a marketplace ledger. Use comparePayoutWithPreviousWeek to explain why a
          seller's weekly payout changed, getLedgerEntries / getCommissionRules for details. proposePayoutHold
          never holds anything: it only records a PENDING proposal that a human analyst must approve.

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is a plain-text scrape endpoint: any Prometheus-compatible tool can read it
        # (see the "observability" compose profile), and nothing happens when nobody scrapes it.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /readiness, for Kubernetes or any container orchestrator.
        enabled: true
  otlp:
    metrics:
      export:
        # spring-boot-starter-opentelemetry also brings the OTLP metrics registry, which would push to
        # localhost:4318 every minute in every run. Only traces are exported (see application-tracing.yml).
        enabled: false
  tracing:
    sampling:
      # Trace every agent request: traffic is low and each trace is an audit of what the model did.
      # Spans are only exported when the "tracing" profile sets an OTLP endpoint.
      probability: 1.0
