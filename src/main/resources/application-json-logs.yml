# Opt-in profile: one JSON object per log line in Elastic Common Schema (ECS) instead of the readable
# console pattern. ECS is an open format understood by Elasticsearch/Kibana, OpenSearch, Grafana Loki,
# Datadog, New Relic, Splunk and most log shippers, so no vendor library or agent is needed in the app.
# Each line carries the trace and span ids plus the key-values logged with SLF4J's fluent API
# (hold.id, agent.tool_calls...) as top-level fields.
logging:
  structured:
    format:
      console: ecs
